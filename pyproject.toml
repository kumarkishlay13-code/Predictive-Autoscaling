[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pas"
version = "0.2.0"
description = "Predictive autoscaling for Kubernetes workloads (local kind cluster or AKS): forecasting, scaling and experiment tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Deep-learning forecaster (weeks 9-11). CPU wheels are enough.
lstm = ["torch>=2.2"]
# Prophet is used offline only (see docs/decisions.md, ADR-007).
prophet = ["prophet>=1.1.5"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
pas = "pas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Commented if/else branches read better than ternaries.
ignore = ["SIM108"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]
