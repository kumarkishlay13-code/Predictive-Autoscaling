# kube-prometheus-stack values. Installed by `pas platform install` as release
# "kube-prometheus-stack" in namespace "monitoring". Everything runs on the system pool so the
# app and load-generator pools only carry what is being measured. The same file serves the local
# kind cluster and AKS: the system pool is labelled pas.dev/pool=system on both.

alertmanager:
  enabled: false

# Control-plane targets are not scrapeable on AKS (managed) and not needed on kind.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

prometheusOperator:
  nodeSelector: {pas.dev/pool: system}

kube-state-metrics:
  nodeSelector: {pas.dev/pool: system}

# No study metric or dashboard panel uses node-exporter, and on Docker Desktop its host root
# mount fails inside kind nodes.
nodeExporter: {enabled: false}

grafana:
  nodeSelector: {pas.dev/pool: system}
  # Dashboards in ConfigMaps labelled grafana_dashboard=1 are loaded automatically.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  defaultDashboardsTimezone: browser

prometheus:
  prometheusSpec:
    nodeSelector: {pas.dev/pool: system}
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 15d
    # k6 pushes client-side latency and errors here (k6 -o experimental-prometheus-rw).
    enableRemoteWriteReceiver: true
    # Pick up every ServiceMonitor in the cluster, not only those labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 2500Mi}
    # A persistent volume (the cluster's default storage class) keeps data across
    # `pas infra stop/start`. Each run is also exported to parquet at its end, so this is a
    # convenience, not the system of record.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
