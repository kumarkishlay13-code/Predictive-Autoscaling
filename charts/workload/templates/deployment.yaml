apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
    {{- include "workload.appSelector" . | nindent 4 }}
spec:
  # No `replicas` field on purpose: the HPA/KEDA (or `pas` during a reset) owns the count,
  # so Helm upgrades never fight it.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "workload.appSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "workload.labels" . | nindent 8 }}
        {{- include "workload.appSelector" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      {{- with .Values.app.nodePool }}
      nodeSelector:
        pas.dev/pool: {{ . }}
      tolerations:
        - key: pas.dev/pool
          operator: Equal
          value: {{ . }}
          effect: NoSchedule
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "workload.appSelector" . | nindent 14 }}
      containers:
        - name: demo-api
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STARTUP_DELAY_SECONDS
              value: {{ .Values.app.startupDelaySeconds | quote }}
            - name: DEFAULT_WORK_UNITS
              value: {{ .Values.app.workUnits | quote }}
            - name: DRAIN_DELAY_SECONDS
              value: {{ .Values.app.drainDelaySeconds | quote }}
            # One OS thread per 250m pod gives the most predictable per-pod capacity.
            - name: GOMAXPROCS
              value: "1"
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            # Short period: readiness detection is part of the scaling lag being measured.
            periodSeconds: 2
            failureThreshold: 1
            successThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            {{- include "workload.containerSecurity" . | nindent 12 }}
