name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,lstm,plots]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart in every scaler mode
        run: |
          set -e
          SET="--set app.image.repository=r/a --set app.image.tag=t --set forecaster.image.repository=r/f --set forecaster.image.tag=t"
          helm lint charts/workload $SET
          for mode in off static hpa predictive; do
            helm template lane charts/workload -n lane-a $SET --set scaler.mode=$mode > /dev/null
          done
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  # The whole local path on a real kind cluster: create it, install the platform, build and load
  # the images, then run `pas smoke` (k6 -> demo-api -> Prometheus -> forecaster -> KEDA -> HPA).
  kind:
    runs-on: ubuntu-latest
    needs: [python, go, manifests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: azure/setup-helm@v4
      - name: Install kind and pas
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind
          pip install -e .
      - run: pas infra up
      - run: pas platform install
      # The smoke test uses the seasonal-naive model, so PyTorch is not needed in the image.
      - run: pas build --no-with-lstm
      - run: pas doctor || true
      - run: pas smoke
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl -n lane-a describe scaledobject,hpa || true
          kubectl -n lane-a logs deploy/demo-api-forecaster --tail=100 || true
          kubectl -n lane-a logs -l app.kubernetes.io/name=k6 --tail=100 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
